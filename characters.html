<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT EDEN TERMINAL — Survivor Index</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: #000;
            color: #00ff99;
            font-family: "Courier New", monospace;
            margin: 0;
            padding-top: 70px; /* space for fixed nav */
        }

        /* NAV BAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0f0f0f;
            border-bottom: 2px solid #00ff99;
            padding: 10px 20px;
            box-shadow: 0 0 10px #00ff99;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
        }

        .nav-title {
            font-size: 20px;
            letter-spacing: 1px;
            text-shadow: 0 0 6px #00ff99;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 25px;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            color: #00ff99;
            text-decoration: none;
            font-size: 15px;
            transition: color 0.2s ease, background-color 0.2s ease;
        }

        .nav-links a:hover {
            color: #000;
            background-color: #00ff99;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .nav-links .active {
            border-bottom: 2px solid #00ff99;
        }

        /* PAGE TITLE */
        h1 {
            text-align: center;
            text-shadow: 0 0 10px #00ff99;
            margin-top: 20px;
        }

        /* CHARACTER GRID */
        .character-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            padding: 40px;
        }

        .character-card {
            background-color: #0a0a0a;
            border: 1px solid #00ff99;
            box-shadow: 0 0 10px #00ff99;
            border-radius: 8px;
            text-align: center;
            padding: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .character-card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #00ff99;
        }

        .character-card img {
            width: 100%;
            border-radius: 6px;
            border: 1px solid #00ff99;
        }

        .character-card h2 {
            margin-top: 10px;
            font-size: 18px;
        }

        .character-card p {
            font-size: 14px;
        }

        .view-profile {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 12px;
            border: 1px solid #00ff99;
            color: #00ff99;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .view-profile:hover {
            background-color: #00ff99;
            color: #000;
        }
    </style>
</head>
<body>
    <!-- NAV BAR -->
    <nav class="navbar">
        <div class="nav-title">PROJECT EDEN TERMINAL</div>
        <ul class="nav-links">
            <li><a href="discord.html">Discord</a></li>
            <li><a href="atlas.html">Atlas</a></li>
            <li><a href="infected-info/index.html">Infected</a></li>
            <li><a href="characters.html" class="active">Survivor Index</a></li>
            <li><a href="factions.html">Factions</a></li>
            <li><a href="community.html">Community Hub</a></li>
        </ul>
    </nav>

    <h1>Survivor Index</h1>

    <div class="character-grid">
        <div class="character-card">
            <img src="assets/characters/darius.png" alt="Darius">
            <h2>Darius</h2>
            <p>Age: 45</p>
            <a href="characters-info/darius.html" class="view-profile">View Profile</a>
        </div>

        <div class="character-card">
            <img src="assets/characters/ben.png" alt="Ben">
            <h2>Ben</h2>
            <p>Age: 35</p>
            <a href="characters-info/ben.html" class="view-profile">View Profile</a>
        </div>

        <div class="character-card">
            <img src="assets/characters/elias.png" alt="Elias">
            <h2>Elias</h2>
            <p>Age: 40</p>
            <a href="characters-info/elias.html" class="view-profile">View Profile</a>
        </div>
    </div>
</body>
</html>
