<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PROJECT EDEN TERMINAL — Survivor Database</title>

<style>
    body {
        background-color: #0d0d0d;
        color: #00ff99;
        font-family: "Courier New", monospace;
        margin: 0;
        padding: 20px;
        text-shadow: 0 0 4px #00ff99;
    }

    h1 {
        text-align: center;
        margin-bottom: 30px;
        font-size: 32px;
        letter-spacing: 2px;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 25px;
        padding: 10px;
    }

    .card {
        background-color: #0f0f0f;
        border: 2px solid #00ff99;
        padding: 15px;
        border-radius: 8px;
        text-align: center;
        box-shadow: 0 0 10px #00ff99;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
        transform: scale(1.05);
        box-shadow: 0 0 18px #00ff99;
    }

    .thumb-frame {
        width: 150px;
        height: 150px;
        margin: 0 auto 15px auto;
        border: 2px solid #00ff99;
        border-radius: 6px;
        overflow: hidden;
        background-color: #001a12;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .thumb-frame img {
        width: 100%;
        height: auto;
        display: block;
    }

    .name {
        font-size: 20px;
        margin-bottom: 5px;
    }

    .age {
        font-size: 14px;
        opacity: 0.8;
        margin-bottom: 15px;
    }

    .btn {
        display: inline-block;
        padding: 8px 12px;
        border: 2px solid #00ff99;
        color: #00ff99;
        text-decoration: none;
        border-radius: 5px;
        transition: background-color 0.2s ease;
    }

    .btn:hover {
        background-color: #00ff99;
        color: #0d0d0d;
    }
</style>
</head>

<body>

<h1>PROJECT EDEN — SURVIVOR DATABASE</h1>

<div class="grid">

    <!-- Lily Ross -->
    <div class="card">
        <div class="thumb-frame">
            <img src="assets/characters/lily_ross_nfe_protrait.png" alt="Lily Ross">
        </div>
        <div class="name">Lily Ross</div>
        <div class="age">Age: 17</div>
        <a class="btn" href="lily-ross.html">View Profile</a>
    </div>
