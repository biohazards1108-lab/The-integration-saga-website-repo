<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integration Terminal</title>

    <style>
        body {
            background: #000;
            color: #00ff88;
            font-family: "Courier New", monospace;
            padding: 40px;
            text-align: center;
        }

        #boot-sequence {
            font-size: 1.2rem;
            line-height: 1.6rem;
            white-space: pre-line;
        }

        .fade-in {
            opacity: 0;
            animation: fadeIn 0.8s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>

<body>

    <div id="boot-sequence"></div>

    <script>
        const lines = [
            "INITIALIZING SYSTEM...",
            "LOADING TERMINAL INTERFACE...",
            "CHECKING INTEGRATION NODES...",
            "AUTHENTICATING USER...",
            "ACCESS GRANTED."
        ];

        const container = document.getElementById("boot-sequence");

        let i = 0;

        function showNextLine() {
            if (i < lines.length) {
                const p = document.createElement("p");
                p.textContent = lines[i];
                p.classList.add("fade-in");
                container.appendChild(p);
                i++;
                setTimeout(showNextLine, 600);
            } else {
                // Redirect after final line
                setTimeout(() => {
                    window.location.href = "characters.html";
                }, 1200);
            }
        }

        showNextLine();
    </script>

</body>
</html>
